    <style>
      /* 启动占位：点桌面图标后立刻有反馈，不等 JS 加载 */
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f6f6fb;
        color: #6b7280;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .boot-splash .boot-logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        box-shadow: 0 10px 30px rgba(79, 70, 229, 0.35);
      }
      .boot-splash .boot-dots {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 13px;
      }
      .boot-splash .boot-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #a5b4fc;
        animation: bootPulse 1s ease-in-out infinite;
      }
      .boot-splash .boot-dot:nth-child(2) {
        animation-delay: 0.15s;
      }
      .boot-splash .boot-dot:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes bootPulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.2);
        }
      }
      @media (prefers-color-scheme: dark) {
        .boot-splash {
          background: #0b0b12;
          color: #9ca3af;
        }
      }
    </style>
